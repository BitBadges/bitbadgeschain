name: Build BitBadgesChain

on:
  push:
    branches:
      - master
  # Without this the suite never runs on a pull request. The only checks a PR
  # got were CodeQL and Snyk, so "the tests pass" was an unverified claim right
  # up to the moment of merge.
  pull_request:

permissions:
  contents: read

env:
  # A hang should fail loudly with a goroutine dump rather than run until the
  # runner kills the job with a bare exit 143 and no diagnosis.
  GO_TEST_TIMEOUT: 30m
  # Split out below; see the comment on the test-tokenization-keeper job.
  HEAVY_PACKAGE: github.com/bitbadges/bitbadgeschain/x/tokenization/keeper

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod so the CI toolchain cannot drift from the one the
          # code actually requires. It was pinned to 1.24.5 while go.mod asks
          # for 1.26.5, which does not build.
          #
          # go-version-file needs setup-go v3+, and checkout/setup-go v2 both
          # run on the long-removed Node 12, so the actions are bumped to their
          # current majors at the same time.
          go-version-file: go.mod

      - name: Build BitBadgesChain
        run: go build ./cmd/bitbadgeschaind/main.go

      - name: Run test suite (everything but the heavy package)
        run: |
          set -euo pipefail
          ALL=$(go list -tags=test ./...)
          REST=$(printf '%s\n' "$ALL" | grep -vx "$HEAVY_PACKAGE")
          # If the heavy package is ever renamed or moved, fail loudly here.
          # Silently running a suite with one package quietly missing is exactly
          # the kind of green-but-untested result this split must not create.
          if [ "$(printf '%s\n' "$REST" | wc -l)" -ne "$(( $(printf '%s\n' "$ALL" | wc -l) - 1 ))" ]; then
            echo "expected to exclude exactly one package ($HEAVY_PACKAGE)" >&2
            echo "it is no longer in 'go list' output - update HEAVY_PACKAGE" >&2
            exit 1
          fi
          go test -tags=test -timeout "$GO_TEST_TIMEOUT" $REST

  # x/tokenization/keeper gets its own runner because its test binary does not
  # fit alongside anything else.
  #
  # Measured: the compiled binary alone, with no build running, peaks at 12.88 GB
  # RSS. A GitHub-hosted ubuntu-latest runner has 16 GB and 4 vCPU, and
  # `go test ./...` runs up to GOMAXPROCS package binaries concurrently, so this
  # package plus any neighbour exhausted memory. The job died with a bare
  # exit 143 and no message, mid-package, on two consecutive runs.
  #
  # GOMEMLIMIT was measured and rejected as the fix: at 4GiB the same binary took
  # 677s instead of 70s (9.6x) AND its peak RSS rose to 14.70 GB, so the
  # footprint is not GC-compressible. Reducing it means changing how the package
  # builds its test apps, which is tracked separately; until then it runs alone.
  test-tokenization-keeper:
    name: Test x/tokenization/keeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run test suite (x/tokenization/keeper)
        run: go test -tags=test -timeout "$GO_TEST_TIMEOUT" ./x/tokenization/keeper/
