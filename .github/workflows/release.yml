name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v29)'
        required: true

permissions:
  contents: write

jobs:
  # While go.mod pins cosmos/evm to an embargoed hotfix repo, this workflow
  # cannot build: the runner has no access to that private module, so every
  # build job fails on `go mod download`. The release binaries are built
  # locally and uploaded to the release by hand for those releases -- see
  # docs/release.md.
  #
  # This gate makes that an explicit, green skip rather than a wall of red
  # failures on the release tag, and stops the release job from running with
  # partial artifacts and overwriting hand-uploaded assets.
  preflight:
    name: Can CI build this tag?
    runs-on: ubuntu-latest
    outputs:
      can_build: ${{ steps.check.outputs.can_build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -qE '^\s*replace\s+github\.com/cosmos/evm\s+=>' go.mod; then
            echo "go.mod redirects cosmos/evm to a private module; CI cannot build it." >&2
            grep -E '^\s*replace\s+github\.com/cosmos/evm\s+=>' go.mod >&2
            echo "Release binaries for this tag are built locally and uploaded by hand." >&2
            echo "can_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_build=true" >> "$GITHUB_OUTPUT"
          fi

  # `test` runs in parallel and is intentionally NON-BLOCKING: no build or
  # release job uses `needs: test`, so a failing test will not block a release.
  test:
    name: Test
    needs: preflight
    if: needs.preflight.outputs.can_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain that builds the released binaries
          # cannot drift from the one the code requires. It was pinned to
          # 1.24.5 while go.mod asks for 1.26.6, which does not build.
          go-version-file: go.mod
      # -timeout makes a hang produce a goroutine dump rather than run until
      # the runner kills the job with a bare, undiagnosable exit 143.
      - name: Run tests
        run: go test -tags=test -timeout 45m ./... -count=1

  build-linux-windows:
    name: Build Linux & Windows
    needs: preflight
    if: needs.preflight.outputs.can_build == 'true'
    # Pinned to 22.04 (glibc 2.35) so release binaries run on Ubuntu 22.04+,
    # Debian 12+, RHEL 9+. ubuntu-latest (24.04, glibc 2.39) breaks older hosts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain that builds the released binaries
          # cannot drift from the one the code requires. It was pinned to
          # 1.24.5 while go.mod asks for 1.26.6, which does not build.
          go-version-file: go.mod

      - name: Install cross-compile toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all Linux + Windows binaries
        run: make build-all-cross VERSION=${{ steps.version.outputs.tag }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-windows
          path: |
            build/bitbadgeschain-linux-amd64
            build/bitbadgeschain-linux-arm64
            build/bitbadgeschain-windows-amd64.exe
            build/bitbadgeschain-testnet-linux-amd64
            build/bitbadgeschain-testnet-linux-arm64
            build/bitbadgeschain-testnet-windows-amd64.exe

  build-darwin:
    name: Build macOS
    needs: preflight
    if: needs.preflight.outputs.can_build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain that builds the released binaries
          # cannot drift from the one the code requires. It was pinned to
          # 1.24.5 while go.mod asks for 1.26.6, which does not build.
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all darwin binaries
        run: |
          make build-mainnet-darwin/amd64 VERSION=${{ steps.version.outputs.tag }}
          make build-mainnet-darwin/arm64 VERSION=${{ steps.version.outputs.tag }}
          make build-testnet-darwin/amd64 VERSION=${{ steps.version.outputs.tag }}
          make build-testnet-darwin/arm64 VERSION=${{ steps.version.outputs.tag }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: |
            build/bitbadgeschain-darwin-amd64
            build/bitbadgeschain-darwin-arm64
            build/bitbadgeschain-testnet-darwin-amd64
            build/bitbadgeschain-testnet-darwin-arm64

  release:
    name: Create Release
    needs: [preflight, build-linux-windows, build-darwin]
    if: needs.preflight.outputs.can_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux & Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-windows
          path: build/

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-darwin
          path: build/

      - name: Generate checksums
        run: |
          cd build
          sha256sum \
            bitbadgeschain-linux-amd64 \
            bitbadgeschain-linux-arm64 \
            bitbadgeschain-darwin-amd64 \
            bitbadgeschain-darwin-arm64 \
            bitbadgeschain-windows-amd64.exe \
            bitbadgeschain-testnet-linux-amd64 \
            bitbadgeschain-testnet-linux-arm64 \
            bitbadgeschain-testnet-darwin-amd64 \
            bitbadgeschain-testnet-darwin-arm64 \
            bitbadgeschain-testnet-windows-amd64.exe \
            > checksums.txt

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: true
          files: |
            build/bitbadgeschain-linux-amd64
            build/bitbadgeschain-linux-arm64
            build/bitbadgeschain-darwin-amd64
            build/bitbadgeschain-darwin-arm64
            build/bitbadgeschain-windows-amd64.exe
            build/bitbadgeschain-testnet-linux-amd64
            build/bitbadgeschain-testnet-linux-arm64
            build/bitbadgeschain-testnet-darwin-amd64
            build/bitbadgeschain-testnet-darwin-arm64
            build/bitbadgeschain-testnet-windows-amd64.exe
            build/checksums.txt
          body: |
            ## Install

            **One-liner:**
            ```bash
            curl -fsSL https://install.bitbadges.io | sh
            ```

            **Testnet:**
            ```bash
            curl -fsSL https://install.bitbadges.io | sh -s -- --testnet
            ```

            **SDK CLI:**
            ```bash
            npm install -g bitbadges
            ```

            ## Binaries

            | Platform | Mainnet | Testnet |
            |----------|---------|---------|
            | Linux x86_64 | `bitbadgeschain-linux-amd64` | `bitbadgeschain-testnet-linux-amd64` |
            | Linux ARM64 | `bitbadgeschain-linux-arm64` | `bitbadgeschain-testnet-linux-arm64` |
            | macOS Intel | `bitbadgeschain-darwin-amd64` | `bitbadgeschain-testnet-darwin-amd64` |
            | macOS Apple Silicon | `bitbadgeschain-darwin-arm64` | `bitbadgeschain-testnet-darwin-arm64` |
            | Windows x86_64 | `bitbadgeschain-windows-amd64.exe` | `bitbadgeschain-testnet-windows-amd64.exe` |

            ## Verify

            ```bash
            sha256sum -c checksums.txt
            ```
