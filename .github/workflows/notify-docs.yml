# Tells BitBadges/bitbadges-monorepo to re-sync after chain sources land on master:
#
#   proto-updated          — proto/** changed, so the proto markdown reference
#                            in the docs repo is stale.
#   chain-openapi-updated  — the generated OpenAPI 3.1 document at
#                            docs/openapi/openapi.json changed (this lands via
#                            the PR that openapi.yml opens, so we watch the
#                            merge push, not the generator run).
#
# Kept SEPARATE from openapi.yml on purpose. openapi.yml opens a
# PR; the docs repo must only re-sync once that PR MERGES, so the notifier has
# to watch pushes to master. Folding it into openapi.yml would fire the
# dispatch while the regenerated spec is still unmerged, and the docs sync
# would pull the old file and open an empty PR.

name: Notify docs

on:
  push:
    branches: [master]
    paths:
      - 'proto/**'
      - 'docs/openapi/**'
      - '.github/workflows/notify-docs.yml'
  workflow_dispatch:
    inputs:
      event_type:
        description: 'Which dispatch to fire at the docs repo'
        required: true
        default: proto-updated
        type: choice
        options:
          - proto-updated
          - chain-openapi-updated

permissions:
  contents: read

concurrency:
  group: notify-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which dispatches to fire
        id: what
        run: |
          set -euo pipefail
          proto=false
          openapi=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.event_type }}" in
              proto-updated)         proto=true ;;
              chain-openapi-updated) openapi=true ;;
            esac
          else
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No usable base commit — firing both dispatches to be safe."
              proto=true
              openapi=true
            else
              CHANGED=$(git diff --name-only "$BEFORE" '${{ github.sha }}')
              echo "$CHANGED"
              if echo "$CHANGED" | grep -q '^proto/'; then
                proto=true
              fi
              if echo "$CHANGED" | grep -q '^docs/openapi/'; then
                openapi=true
              fi
            fi
          fi

          echo "proto=$proto" >> "$GITHUB_OUTPUT"
          echo "openapi=$openapi" >> "$GITHUB_OUTPUT"
          echo "proto-updated: $proto / chain-openapi-updated: $openapi"

      - name: Fire proto-updated
        if: steps.what.outputs.proto == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          # DOCS_DISPATCH_PAT: fine-grained PAT on BitBadges/bitbadges-monorepo with
          # Contents: read-write and Pull requests: read-write.
          token: ${{ secrets.DOCS_DISPATCH_PAT }}
          repository: BitBadges/bitbadges-monorepo
          event-type: proto-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "source": "${{ github.repository }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Fire chain-openapi-updated
        if: steps.what.outputs.openapi == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_PAT }}
          repository: BitBadges/bitbadges-monorepo
          event-type: chain-openapi-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "source": "${{ github.repository }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
